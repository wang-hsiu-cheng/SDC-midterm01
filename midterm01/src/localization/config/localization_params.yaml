/**:
  ros__parameters:
    # 點雲與地圖前處理
    map_voxel_leaf_size: 1.0
    input_voxel_leaf_size: 0.3
    submap_half_size: 100.0
    submap_half_height: 30.0
    min_input_points: 10
    ply_scale: 3.0

    # Coarse-to-Fine G-ICP 雙層配準參數
    coarse_voxel_size: 1.2
    coarse_max_corr_dist: 3.0
    coarse_max_iterations: 35
    fine_voxel_size: 0.3
    fine_max_corr_dist: 0.8
    fine_max_iterations: 25
    gicp_transformation_epsilon: 0.0001
    gicp_rotation_epsilon: 0.0001
    gicp_max_fitness_score: 3.0

    # 運動先驗與動態懲罰 (Track03 核心)
    enable_motion_prior: true
    max_linear_velocity: 35.0      # m/s (超過此瞬時車速判定配準跳變)
    max_angular_velocity: 1.5      # rad/s (超過此角速度判定 Yaw 偏離)
    motion_prior_weight: 0.5       # 與 noisy init_guess 融合之權重
    outlier_threshold_dist: 3.0    # 雜訊偏差超過 3m 則啟動懲罰自適應增強

    # 系統運作
    publish_global_map: false
    keep_alive: true
    max_frames: 0